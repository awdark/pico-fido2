name: Build ESP32-S3 Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ESP32-S3 Binary
        id: build
        run: |
          mkdir -p out
          export ESP_PRODUCT="esp32s3"
          export ESP_NAME="ESP32-S3"

          # Clone ESP-IDF v5.5
          git clone --recursive https://github.com/espressif/esp-idf.git -b v5.5 --depth=1 esp-idf-dir
          cd esp-idf-dir
          ./install.sh $ESP_PRODUCT
          . ./export.sh
          cd ..

          # Set target and build
          idf.py set-target $ESP_PRODUCT
          idf.py all

          # Merge binaries into single flashable file
          cd build
          esptool.py --chip $ESP_NAME merge_bin -o pico_fido_esp32s3.bin @flash_args
          cp pico_fido_esp32s3.bin ../out/

      - name: Upload ESP32-S3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_fido_esp32s3
          path: out/pico_fido_esp32s3.bin
